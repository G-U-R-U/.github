# Caller for this repository: assigns the owner to new or reopened issues and pull requests. Uses
# the local copy of the reusable workflow; other repositories call it pinned by commit SHA (see
# README.md).
name: Triage

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign-owner:
    # A called workflow can't get more permissions than the job that calls it.
    permissions:
      issues: write
      pull-requests: write
    uses: ./.github/workflows/assign-owner.yml
