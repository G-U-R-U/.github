# Reusable workflow: adds the pull request that started the caller to a G.U.R.U project board.
# The caller runs on pull_request_target (opened, reopened) and passes the secret
# ADD_TO_PROJECT_PAT: a classic personal access token with the repo and project scopes.
# Organisation secrets don't reach private repositories on the Free plan, so each calling
# repository holds its own copy.
name: Add pull requests to project

on:
  workflow_call:
    inputs:
      project-url:
        description: URL of the project board to add the pull request to.
        type: string
        default: https://github.com/orgs/G-U-R-U/projects/1
    secrets:
      ADD_TO_PROJECT_PAT:
        description: Classic personal access token with the repo and project scopes.
        required: true

permissions: {}

jobs:
  add-to-project:
    # In a called workflow, github.event is the caller's event. Dependabot PRs get no repository
    # secrets, so this job would fail on them; update PRs also stay off the board on purpose.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: ${{ inputs.project-url }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
