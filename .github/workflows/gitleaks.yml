# Reusable workflow: scans the full Git history of the calling repository for secrets with gitleaks.
# In a called workflow, actions/checkout checks out the caller's repository, which is what we want.
name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # gitleaks command-line tool, not the gitleaks Action (which needs a licence key for
      # organisations). The checksum comes from the release's gitleaks_<version>_checksums.txt.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so a secret committed and later deleted is still found.
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks, full history)
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          # gitleaks' default log options leave out the diffs of merge commits, so a secret added
          # while resolving a merge would be missed. These are its defaults plus -m.
          ./gitleaks git --redact --no-banner --verbose \
            --log-opts="-m --all --full-history --diff-filter=tuxdb" "$GITHUB_WORKSPACE"
